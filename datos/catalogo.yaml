    limitaciones: |
      IMPORTANTE - NORMALIZACIÓN DE PUNTAJES:
      Los puntajes Saber Pro están normalizados por diseño del ICFES.
      Cada módulo tiene media≈150 y SD≈25 FIJA cada año. Las preguntas
      cambian de un año a otro. Por lo tanto:
      - NO es válido comparar medias de puntajes entre años distintos
      - SÍ es válido comparar rankings relativos DENTRO del mismo año
      - SÍ es válido ver qué programas/IES están por encima del percentil 75
      
      Nota de encoding: Algunos valores en nucleo_pregrado y depto_presentacion
      tienen caracteres corruptos (ej: BOGOTÁ → BOGOT\x81) por lectura
      UTF-8 como latin-1 en la API. Son cosméticos y se corrigen con
      .str.encode('latin-1').str.decode('utf-8').
