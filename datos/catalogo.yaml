fuentes:
  - nombre: "Presupuesto de Educación Nacional (PTE)"
    plataforma: "datos.gov.co / MinEducacion"
    socrata_id: "5phs-yqfw"
    url: "https://www.datos.gov.co/resource/5phs-yqfw"
    url_historica: "https://www.mineducacion.gov.co/portal/micrositios-institucionales/Presupuesto/Reportes-de-ejecucion-presupuestal/"
    url_pte: "https://www.pte.gov.co/presupuesto-general-nacion/seguimiento-ejecucion-presupuestal-gastos"
    formato: "parquet/csv/xlsx (cuadro dnp y formato de reporte a siif)"
    campos_clave:
      - "anio"
      - "nombreentidad"
      - "codigoentidad"
      - "descripcion"
    periodicidad: "anual"
    ultimo_pull: "2025-01-20"
    notas: |
      Datos 2019-2024 vía Socrata (Hacienda) y nuevos excels desde pte.gov.co (formatos cuadro DNP y reporte a SIIF). Datos 2015-2018 descargados de MinEducacion (URL Historica).
      
      PROCESAMIENTO:
      - Archivos manuales 2015-2018: Headers en fila 3 (indice 3), datos desde fila 4
      - Archivos API / pte.gov.co 2019-2024: Headers en fila 0, estructura estandar (Cuadro 7 DNP y Reportes SIIF UEJ)
      - Total registros consolidados: 36,888
      - Entidades unicas: 41
      - Rubros presupuestales: 682
      - Periodos: 10 (2015-2024)
      
      MAPEO DE COLUMNAS (Archivos manuales -> Estandar):
      - NOMBRE UEJ -> nombreentidad
      - DESCRIPCION -> descripcion
      - APR. INICIAL -> apropiacioninicial
      - APR. VIGENTE -> apropiacionvigente
      - COMPROMISO -> compromisos
      - OBLIGACION -> obligaciones
      - PAGOS -> pagos
    esquema_columnas:
      # Columnas de dimension
      - nombre: "anio"
        tipo: "int"
        descripcion: "Año de la vigencia fiscal"
      - nombre: "nombreentidad"
        tipo: "string"
        descripcion: "Nombre de la institución o entidad"
      - nombre: "codigoentidad"
        tipo: "string"
        descripcion: "Codigo unico de la entidad"
      - nombre: "descripcion"
        tipo: "string"
        descripcion: "Detalle del rubro presupuestal"
      - nombre: "rubro"
        tipo: "string"
        descripcion: "Codigo del rubro presupuestal"
      - nombre: "fuente"
        tipo: "string"
        descripcion: "Fuente de los recursos (Nacion, etc.)"
      - nombre: "recurso"
        tipo: "string"
        descripcion: "Tipo de recurso presupuestal"
      # Columnas de medida (presupuesto)
      - nombre: "apropiacioninicial"
        tipo: "float"
        descripcion: "Presupuesto inicial asignado"
      - nombre: "apropiacionvigente"
        tipo: "float"
        descripcion: "Presupuesto total disponible (inicial + adiciones - reducciones)"
      - nombre: "compromisos"
        tipo: "float"
        descripcion: "Monto comprometido para gasto"
      - nombre: "obligaciones"
        tipo: "float"
        descripcion: "Monto obligado (causa reconocida)"
      - nombre: "pagos"
        tipo: "float"
        descripcion: "Monto efectivamente pagado"
    modelo_estrella:
      dimensiones:
        - dim_entidad: 41 registros
        - dim_rubro: 682 registros
        - dim_periodo: 10 registros (2015-2024)
      hechos:
        - fact_presupuesto: 36,888 registros
      total_presupuesto:
        apropiacionvigente: "$5,198,937,793,648,043"
        compromisos: "$3,434,430,296,661,532"
        pagos: "$2,741,922,804,146,990"
      eficiencia_promedio: "52.3%"

  - nombre: "ICFES Saber 11 - Histórico Nacional"
