        descripcion: "Puntaje global Saber Pro (0-500)"
      - nombre: "percentil_global"
        tipo: "float"
        descripcion: "Percentil global Saber Pro"
    modelo_estrella:
      dimensiones:
        - dim_periodo: periodos ICFES (2012-2024)
        - dim_institucion: colegios por codigo DANE
        - dim_estudiante_cohorte: cohortes anonimizados
        - dim_prueba: Saber 11, Saber Pro
      hechos:
        - fact_resultados_saber: 1,471,551 registros cruzados
      medidas:
        - punt_lenguaje, punt_matematicas, punt_ingles (Saber 11)
        - mod_comuni_escrita_punt, mod_razona_cuantitat_punt, mod_ingles_punt, mod_competen_ciudada_punt (Saber Pro)
        - punt_global, percentil_global

  - nombre: "SNIES Matriculados - Educación Superior"
    plataforma: "SNIES - MinEducacion"
    formato: "parquet"
    campos_clave:
      - "anio"
      - "semestre"
      - "codigo_institucion"
      - "nombre_programa"
    periodicidad: "semestral"
    notas: |
      Datos de matriculados en educacion superior en Colombia.
      - Total registros consolidados: 676,587
      - Periodos cubiertos: 2015-2024 (20 semestres)
      - Instituciones unicas: 350
      - Programas unicos: 10,804
      - Total matriculados: 47,167,276
      
      PROCESAMIENTO:
      - Limpieza con mapeo de columnas estandarizadas
      - Columnas CINE solo disponibles 2019-2024
      - Consolidado con 19 columnas comunes a todos los anos
      - Visualizaciones generadas: evolucion temporal, distribucion por genero, top instituciones, distribucion por sector
    esquema_columnas:
      # Identificadores
      - nombre: "anio"
        tipo: "int"
        descripcion: "Año del periodo academico"
      - nombre: "semestre"
        tipo: "string"
        descripcion: "Semestre academico (I o II)"
      - nombre: "codigo_institucion"
        tipo: "string"
        descripcion: "Codigo unico de la institucion de educacion superior"
      - nombre: "nombre_institucion"
        tipo: "string"
        descripcion: "Nombre de la institucion de educacion superior"
      # Caracteristicas institucion
      - nombre: "sector"
        tipo: "string"
        descripcion: "Sector de la institucion (Oficial, No oficial)"
      - nombre: "caracter"
        tipo: "string"
        descripcion: "Caracter de la institucion"
      - nombre: "tipo_ies"
        tipo: "string"
        descripcion: "Tipo de institucion (Universidad, Institucion Universitaria, etc.)"
      - nombre: "mcpio_ies"
        tipo: "string"
        descripcion: "Municipio de ubicacion de la institucion"
      # Programa academico
      - nombre: "nombre_programa"
        tipo: "string"
        descripcion: "Nombre del programa academico"
      - nombre: "nivel"
        tipo: "string"
        descripcion: "Nivel academico (Pregrado, Posgrado, etc.)"
      - nombre: "nivel_formacion"
        tipo: "string"
        descripcion: "Nivel de formacion especifico"
      - nombre: "metodologia"
        tipo: "string"
        descripcion: "Metodologia del programa (Presencial, A distancia, etc.)"
      # Area de conocimiento
      - nombre: "area_conocimiento"
        tipo: "string"
        descripcion: "Area grande de conocimiento"
      - nombre: "nucleo_conocimiento"
        tipo: "string"
        descripcion: "Nucleo basico de conocimiento"
      # Ubicacion programa
      - nombre: "depto_programa"
        tipo: "string"
        descripcion: "Departamento de oferta del programa"
      - nombre: "mcpio_programa"
        tipo: "string"
        descripcion: "Municipio de oferta del programa"
      # Estudiante
      - nombre: "genero"
        tipo: "string"
        descripcion: "Genero del estudiante (MASCULINO, FEMENINO, NO BINARIO, TRANS)"
      - nombre: "id_genero"
        tipo: "string"
        descripcion: "Identificador del genero"
      # Medida
      - nombre: "matriculados"
        tipo: "float"
        descripcion: "Numero de matriculados en el periodo"
    estadisticas:
      total_registros: 676,587
      total_matriculados: 47,167,276
      instituciones_unicas: 350
      programas_unicos: 10,804
      periodo: "2015-2024"
      distribucion_genero:
        FEMENINO: 25,069,667 (53.2%)
        MASCULINO: 22,097,492 (46.8%)
        NO_BINARIO: 102 (0.0002%)
        TRANS: 15 (0.00003%)
    visualizaciones:
      - Imagenes/SNIES_Evolucion_Matriculados.png
      - Imagenes/SNIES_Distribucion_Genero.png
      - Imagenes/SNIES_Top_Instituciones.png
      - Imagenes/SNIES_Distribucion_Sector.png
