# Catálogo de Datos del Proyecto
# ================================
# Cada entrada incluye el identificador Socrata, la URL, campos clave
# y la periodicidad de actualizacion.
#
# fuentes:
#   - nombre: "Nombre descriptivo del dataset"
#     plataforma: "datos.gov.co"
#     socrata_id: "xxxx-xxxx"
#     url: "https://www.datos.gov.co/resource/xxxx-xxxx"
#     formato: "csv"
#     campos_clave:
#       - campo1
#       - campo2
#     periodicidad: "trimestral"
#     ultimo_pull: null
#     notas: "Descripcion breve"

fuentes:
  - nombre: "SNIES - Estadísticas Consolidadas"
    plataforma: "snies.mineducacion.gov.co"
    url: "https://snies.mineducacion.gov.co/portal/ESTADISTICAS/Bases-consolidadas/"
    formato: "xlsx"
    campos_clave:
      - codigo_institucion
      - nombre_institucion
      - programa_academico
      - nivel_academico
      - departamento
      - municipio
      - año
      - tipo_registro
    periodicidad: "anual"
    ultimo_pull: null
    notas: "Bases consolidadas de matriculados y graduados SNIES"
