      # Institucion
      - nombre: "cole_cod_dane_establecimiento"
        tipo: "string"
        descripcion: "Código DANE del establecimiento educativo"
      - nombre: "cole_nombre_establecimiento"
        tipo: "string"
        descripcion: "Nombre de la institución educativa"
