        tipo: "string"
        descripcion: "Código DANE del departamento de ubicación"
      - nombre: "cole_cod_mcpio_ubicacion"
        tipo: "string"
        descripcion: "Código DANE del municipio de ubicación"
      # Estudiante
      - nombre: "estu_genero"
        tipo: "string"
        descripcion: "Género del estudiante (MASCULINO/FEMENINO)"
