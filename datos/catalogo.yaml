    archivo_consolidado: "datos/processed/pte/pte_consolidado_full.parquet"
    diccionario_mapeo: "src/ingesta/header_utils_dnp_siif.py"
    script_limpieza: "src/ingesta/pte.py"
    plataforma: "MinEducacion (excels manuales 2015-2018) + pte.gov.co (SIIF/DNP 2019-2024)"
    formato_salida: "parquet"
    periodicidad: "anual"
    ultimo_pull: "2025-01-20"
    estadisticas:
      total_registros: 2091
      columnas: 22
      uej_unicas: 48
      periodo: "2015-2024"
    limitaciones: |
      LIMITACIÓN CRÍTICA: Las 47 universidades públicas (UEJ) solo aparecen en los
      datos 2015-2018 (fuente: men_excel). A partir de 2019, los formatos SIIF y DNP
      Cuadro 7 solo reportan al "MINISTERIO EDUCACION NACIONAL - GESTION GENERAL"
      como entidad agregada. NO hay trazabilidad por universidad, programa o departamento
      en 2019-2024.
      
      Distribución por fuente:
        - men_excel: 1,957 filas (93.5%) → MEN agregado
        - siif_uej: 68 filas → universidades individuales (solo 2015-2018)
        - dnp_cuadro7: 51 filas → rubros DNP
        - interpolado_2018_2020: 15 filas → estimaciones

      Esto impide cruzar PTE con SNIES/Saber Pro a nivel de programa o IES.
      Solo sirve para análisis macro del gasto del sector educación.
