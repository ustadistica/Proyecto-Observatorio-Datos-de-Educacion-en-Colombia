  # --------------------------------------------------------------------------
  # LLAVES DE CRUCE ENTRE FUENTES
  # --------------------------------------------------------------------------
cruces:
  snies_saber_pro:
    llave: "codigo_snies_programa"
    descripcion: |
      El código SNIES del programa aparece en ambas fuentes:
      - SNIES: columna "codigo_snies_programa" (string)
      - Saber Pro: columna "codigo_snies_programa" (float → cast a int/string)
      Permite cruzar graduados del SNIES con presentaciones de Saber Pro
      del mismo programa en el mismo año.
    nota_temporal: |
      Saber Pro se presenta típicamente en el último semestre de la carrera.
      Por lo tanto, presentaciones Saber Pro del año X se alinean mejor
      con graduados SNIES del año X (mismo cohorte).
  pte_snies:
    posible: false
    razon: |
      El PTE no tiene codigo_snies_programa ni departamento.
      Las 47 universidades del PTE (solo 2015-2018) podrían matchear
      por nombre con SNIES, pero es frágil y solo cubre universidades
      públicas en un periodo limitado. NO RECOMENDADO.
