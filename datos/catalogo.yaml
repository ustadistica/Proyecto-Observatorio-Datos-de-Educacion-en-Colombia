    formato_salida: "parquet"
    periodicidad: "semestral"
    ultimo_pull: "2025-01-20"
    estadisticas:
      total_registros: 420594
      columnas: 45
      periodo: "2015-2024"
    notas: |
      Misma estructura que SNIES Matriculados (45 columnas), excepto:
      - La columna de medida es "graduados" en vez de "matriculados"
      - Representa egresados que obtuvieron título en el periodo
      - RELEVANCIA PARA CRUCE: Saber Pro se presenta al final de carrera,
        por lo tanto se alinea mejor con graduados que con matriculados.
    llave_cruce_saber_pro: "codigo_snies_programa"
    esquema_columnas:
      # (Mismas 44 columnas que Matriculados, cambiando la medida)
      - nombre: "graduados"
        tipo: "float"
        descripcion: "Número de graduados en el periodo"
      # ... resto idéntico a SNIES Matriculados

