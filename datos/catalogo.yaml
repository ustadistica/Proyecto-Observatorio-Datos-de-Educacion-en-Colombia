  - nombre: "Cruce Saber 11 - Saber Pro (Consolidado)"
    plataforma: "Procesamiento interno - ICFES"
    formato: "parquet"
    campos_clave:
      - "estu_consecutivo_sb11"
      - "estu_consecutivo_sbpro"
    periodicidad: "cruce histórico"
    notas: |
      Cruce metodológico entre Saber 11 y Saber Pro usando consecutivos ICFES.
      - Total registros cruzados: 1,471,551
      - Periodos cubiertos: 2012-2024
      - Método: Inner join por consecutivo de estudiante
      
      VARIABLES DEL CRUCE (31 columnas):
      - Identificadores Saber 11: estu_consecutivo_sb11, periodo_sb11, anio_sb11
      - Identificadores Saber Pro: estu_consecutivo_sbpro, periodo_pro
      - Institución: cole_cod_dane_establecimiento, cole_nombre_establecimiento
      - Puntajes Saber 11: punt_lenguaje, punt_matematicas, punt_ingles
      - Puntajes Saber Pro: mod_comuni_escrita_punt, mod_razona_cuantitat_punt, mod_ingles_punt, mod_competen_ciudada_punt, punt_global, percentil_global
      - Características estudiante: estu_genero_11, estu_genero_pro, estu_edad, estu_fechanacimiento
      - Ubicación: estu_depto_presentacion_11, estu_mcpio_presentacion_11, estu_depto_presentacion_pro, estu_mcpio_presentacion_pro, cole_cod_depto_ubicacion, cole_cod_mcpio_ubicacion
    esquema_columnas:
      # Identificadores cruzados
      - nombre: "estu_consecutivo_sb11"
        tipo: "string"
        descripcion: "Consecutivo Saber 11 del estudiante"
      - nombre: "periodo_sb11"
        tipo: "string"
        descripcion: "Periodo de presentación Saber 11"
      - nombre: "estu_consecutivo_sbpro"
        tipo: "string"
        descripcion: "Consecutivo Saber Pro del estudiante"
      - nombre: "periodo_pro"
        tipo: "string"
        descripcion: "Periodo de presentación Saber Pro"
      # Años
      - nombre: "anio_sb11"
        tipo: "int"
        descripcion: "Año de presentación Saber 11"
      - nombre: "anio_sbpro"
        tipo: "int"
        descripcion: "Año de presentación Saber Pro"
      # Institución
      - nombre: "cole_cod_dane_establecimiento"
        tipo: "string"
        descripcion: "Código DANE del establecimiento educativo"
      - nombre: "cole_nombre_establecimiento"
        tipo: "string"
        descripcion: "Nombre de la institución educativa"
      - nombre: "cole_cod_depto_ubicacion"
        tipo: "string"
        descripcion: "Código DANE del departamento"
      - nombre: "cole_cod_mcpio_ubicacion"
        tipo: "string"
        descripcion: "Código DANE del municipio"
      # Características del estudiante
      - nombre: "estu_genero_11"
        tipo: "string"
        descripcion: "Género del estudiante (Saber 11)"
      - nombre: "estu_genero_pro"
        tipo: "string"
        descripcion: "Género del estudiante (Saber Pro)"
      - nombre: "estu_edad"
        tipo: "int"
        descripcion: "Edad del estudiante"
      - nombre: "estu_fechanacimiento"
        tipo: "string"
        descripcion: "Fecha de nacimiento"
      # Ubicación presentación
      - nombre: "estu_depto_presentacion_11"
        tipo: "string"
        descripcion: "Departamento presentación Saber 11"
      - nombre: "estu_mcpio_presentacion_11"
        tipo: "string"
        descripcion: "Municipio presentación Saber 11"
      - nombre: "estu_depto_presentacion_pro"
        tipo: "string"
        descripcion: "Departamento presentación Saber Pro"
      - nombre: "estu_mcpio_presentacion_pro"
        tipo: "string"
        descripcion: "Municipio presentación Saber Pro"
      # Puntajes Saber 11
      - nombre: "punt_lenguaje"
        tipo: "float"
        descripcion: "Puntaje lectura crítica Saber 11 (0-500)"
      - nombre: "punt_matematicas"
        tipo: "float"
        descripcion: "Puntaje matemáticas Saber 11 (0-500)"
      - nombre: "punt_ingles"
        tipo: "float"
        descripcion: "Puntaje inglés Saber 11 (0-500)"
      # Puntajes Saber Pro
      - nombre: "mod_comuni_escrita_punt"
        tipo: "float"
        descripcion: "Puntaje comunicación escrita Saber Pro (0-500)"
      - nombre: "mod_razona_cuantitat_punt"
        tipo: "float"
        descripcion: "Puntaje razonamiento cuantitativo Saber Pro (0-500)"
      - nombre: "mod_ingles_punt"
        tipo: "float"
        descripcion: "Puntaje inglés Saber Pro (0-500)"
      - nombre: "mod_competen_ciudada_punt"
        tipo: "float"
        descripcion: "Puntaje competencias ciudadanas Saber Pro (0-500)"
      # Puntajes globales
      - nombre: "punt_global"
