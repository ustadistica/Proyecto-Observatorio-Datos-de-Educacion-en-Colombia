# FUENTES DE DATOS
# ============================================================================

fuentes:
  - nombre: "Examen Saber Pro - Competencias Genéricas"
    institucion: "Instituto Colombiano para la Evaluación de la Educación (ICFES)"
    tipo: "Microdatos - Nivel Estudiante"
    periodicidad: "Dos aplicaciones por año (generalmente mayo y octubre)"
    cobertura_temporal: "2012-2024"
    cobertura_geografica: "Nacional (Colombia) + Ciudades Internacionales (2017-2019)"
    unidad_analisis: "Estudiante que presenta el examen Saber Pro"
    metodo_recoleccion: "Censo - Todos los estudiantes que presentan el examen"
    formato_original: "CSV con delimitador punto y coma (;)"
    encoding_original: "UTF-8"
    url_oficial: "https://www.icfes.gov.co/web/guest/registros-administrativos-y-microdatos"
    fecha_ultima_descarga: "2025-01-15"
    notas_acceso: >
      Los microdatos se pueden solicitar directamente al ICFES o descargar desde
      el portal de datos abiertos cuando están disponibles. Para fines académicos
      se requiere registro y aceptación de términos de uso.

# ============================================================================
# PROCESO DE PROCESAMIENTO (ETL)
# ============================================================================

procesamiento:
  descripcion_general: >
    El proceso de procesamiento incluye validación, limpieza, estandarización y
    consolidación de las bases de datos anuales del Saber Pro. Cada archivo pasa
    por un pipeline automatizado que garantiza calidad y consistencia. El proceso
    está completamente documentado y es reproducible.
  
  pasos:
    - paso: 1
      nombre: "Validación de existencia"
      descripcion: >
        Verificación de que el archivo fuente exista en el directorio de datos
        crudos con el nombre y formato esperados.
    
    - paso: 2
      nombre: "Carga de datos"
      descripcion: >
        Lectura del archivo CSV con delimitador ';', encoding UTF-8, preservando
        inicialmente todos los campos como texto para evitar pérdidas de información.
    
    - paso: 3
      nombre: "Validación estructural"
      descripcion: >
        Verificación de columnas esenciales (periodo, estu_consecutivo, estu_genero,
        punt_global, percentil_global), detección de filas vacías y duplicados.
    
    - paso: 4
      nombre: "Limpieza de datos"
      descripcion: >
        Eliminación de filas completamente vacías, eliminación de duplicados exactos,
        estandarización de nombres de columnas (minúsculas, guiones bajos), conversión
        de columnas numéricas críticas (punt_global, percentil_global).
    
    - paso: 5
      nombre: "Enriquecimiento con metadatos"
      descripcion: >
        Agregación de columnas de control: anio_procesamiento (año de los datos) y
        fecha_procesamiento (timestamp del procesamiento).
    
    - paso: 6
      nombre: "Exportación a Parquet"
      descripcion: >
        Conversión a formato Parquet para optimizar almacenamiento y consultas.
        Se genera un archivo individual por año.
    
    - paso: 7
      nombre: "Consolidación"
      descripcion: >
        Unión de todos los archivos Parquet individuales en un único archivo consolidado
        que contiene todos los años procesados.

  scripts:
    - nombre: "procesar_saber_pro.py"
      descripcion: "Script principal de procesamiento ETL"
      funciones_principales:
        - "validar_archivo_existe()"
        - "cargar_datos()"
        - "validar_estructura()"
        - "limpiar_datos()"
        - "guardar_parquet()"
        - "consolidar_todos_anios()"
    
    - nombre: "analisis_descriptivo.py"
      descripcion: "Análisis exploratorio automático y generación de gráficos"
      funciones_principales:
        - "analisis_instituciones_top()"
        - "analisis_por_departamento()"
        - "analisis_puntajes_por_categoria()"
        - "analisis_genero_puntajes()"
        - "analisis_temporal()"
        - "generar_reporte_completo()"
    
    - nombre: "app_streamlit.py"
      descripcion: "Dashboard ejecutivo interactivo"
      caracteristicas:
        - "KPIs de procesamiento"
        - "Gráficos interactivos por año"
        - "Análisis descriptivo consolidado"
        - "Detalle de ciudades internacionales"
        - "Muestra de datos procesados"

  herramientas:
    - "Python 3.8+"
    - "pandas"
    - "pyarrow"
    - "numpy"
    - "streamlit"
    - "plotly"

  metricas_procesamiento:
    total_registros_procesados: 3384532
    total_anios: 13
    archivos_generados: 14
    formato_salida: "Parquet (pyarrow)"
    compresion: "Snappy"
    tiempo_estimado: "~8 minutos para los 13 años"
    memoria_requerida: "~2.5GB en el pico de consolidación"
    
