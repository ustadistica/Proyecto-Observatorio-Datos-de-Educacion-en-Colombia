metadatos:
  titulo: "Bases de Datos del Examen Saber Pro - Competencias Genéricas"
  version: "2.0"
  fecha_creacion: "2026-04-28"
  descripcion: >
    Conjunto de datos históricos del examen de estado de la educación superior
    en Colombia, específicamente el módulo de competencias genéricas. Los datos
    incluyen información sociodemográfica, académica y de puntajes de estudiantes
    que presentaron la prueba entre 2012 y 2024. Este catálogo documenta
    exhaustivamente el proceso ETL, la estructura de variables, los archivos
    generados y los hallazgos clave del análisis exploratorio.
  autor: "Equipo de Análisis de Datos - Observatorio de Educación"
  contacto: "observatorio.educacion@usantotomas.edu.co"
  licencia: "Datos abiertos - Uso académico y de investigación"
  palabras_clave:
    - "Saber Pro"
    - "ICFES"
    - "Educación Superior"
    - "Competencias Genéricas"
    - "Colombia"
    - "Estudiantes"
    - "Evaluación"
    - "Calidad educativa"
    - "Pruebas estandarizadas"

