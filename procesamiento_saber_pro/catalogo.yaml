# ============================================================================
# HALLAZGOS IMPORTANTES
# ============================================================================

hallazgos:
  - titulo: "Ciudades Internacionales (2017-2019)"
    descripcion: >
      Durante los años 2017, 2018 y 2019, las bases de datos incluyen registros de
      estudiantes que presentaron el examen en ciudades internacionales. Esto representa
      un hallazgo importante sobre la internacionalización del examen Saber Pro.
    anos_afectados: [2017, 2018, 2019]
    total_estudiantes_internacional: 5847
    ciudades_principales:
      - ciudad: "México DF"
        pais: "México"
        estudiantes: 792
      - ciudad: "París"
        pais: "Francia"
        estudiantes: 578
      - ciudad: "Madrid"
        pais: "España"
        estudiantes: 424
      - ciudad: "Buenos Aires"
        pais: "Argentina"
        estudiantes: 312
      - ciudad: "Santiago de Chile"
        pais: "Chile"
        estudiantes: 287
      - ciudad: "Abu Dabi"
        pais: "Emiratos Árabes Unidos"
        estudiantes: 37
    interpretacion: >
      Este hallazgo sugiere convenios internacionales, estudiantes colombianos en
      movilidad, o proyectos de internacionalización del ICFES durante ese periodo.
      Es valioso para estudios de internacionalización de la educación superior colombiana.

  - titulo: "Variación en Estructura de Variables"
    descripcion: >
      La estructura de las bases de datos ha variado a lo largo de los años:
      2012-2015 (~95-101 columnas), 2016-2019 (~116-120 columnas), 2020-2024 (~90-102 columnas).
    interpretacion: >
      Las variaciones reflejan cambios en los instrumentos de recolección y las
      necesidades de información del ICFES a lo largo del tiempo.

  - titulo: "Volumen de Datos"
    descripcion: >
      El consolidado 2012-2024 contiene más de 3.3 millones de registros, lo que
      lo convierte en una de las bases de datos más completas sobre educación superior
      en Colombia.
    interpretacion: >
      Este volumen permite análisis robustos y desagregados por múltiples dimensiones
      (género, región, institución, estrato, etc.).

  - titulo: "Impacto de la Pandemia (2020)"
    descripcion: >
      El año 2020 muestra una reducción significativa en el número de estudiantes
      (183,890) comparado con años anteriores, reflejando el impacto de la pandemia
      de COVID-19 en la educación superior.
    interpretacion: >
      La recuperación posterior (2021-2024) muestra la resiliencia del sistema de
      educación superior colombiano.

