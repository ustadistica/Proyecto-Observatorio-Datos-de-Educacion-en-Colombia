stages:
  verificar_entorno:
    cmd: python -c "import pandas; import numpy; import openpyxl; import 
      pyarrow; print('✅ Entorno verificado'); 
      open('reportes/entorno_verificado.txt', 'w').write('Entorno OK')"
    outs:
    - reportes/entorno_verificado.txt
  probar_ingesta_snies:
    cmd: python src/ingesta/ingesta_snies.py && echo '✅ Ingesta SNIES 
      verificada' > reportes/ingesta_snies_verificada.txt
    deps:
    - datos/raw/snies/
    - src/ingesta/ingesta_snies.py
    outs:
    - reportes/ingesta_snies_verificada.txt
  probar_ingesta_original:
    cmd: python src/ingesta/ingesta_snies_original.py && echo '✅ Ingesta 
      original verificada' > reportes/ingesta_original_verificada.txt
    deps:
    - src/ingesta/ingesta_snies_original.py
    outs:
    - reportes/ingesta_original_verificada.txt
  probar_ingesta_main:
    cmd: python src/ingesta/main.py && echo '✅ Ingesta main verificada' > 
      reportes/ingesta_main_verificada.txt
    deps:
    - src/ingesta/main.py
    outs:
    - reportes/ingesta_main_verificada.txt
  probar_transformacion:
    cmd: python src/transformacion/main.py && echo '✅ Transformación verificada'
      > reportes/transformacion_verificada.txt
    deps:
    - src/transformacion/main.py
    outs:
    - reportes/transformacion_verificada.txt
  probar_visualizacion:
    cmd: python -c "import src.visualizacion; print('✅ Visualización OK')" && 
      echo '✅ Visualización verificada' > reportes/visualizacion_verificada.txt
    deps:
    - src/visualizacion/__init__.py
    outs:
    - reportes/visualizacion_verificada.txt
  probar_modelo:
    cmd: python -c "import src.modelo; print('✅ Modelo OK')" && echo '✅ Modelo 
      verificado' > reportes/modelo_verificado.txt
    deps:
    - src/modelo/__init__.py
    outs:
    - reportes/modelo_verificado.txt
  probar_tests:
    cmd: python -m pytest tests/ -v && echo '✅ Tests verificados' > 
      reportes/tests_verificados.txt
    deps:
    - tests/__init__.py
    - tests/test_ingesta.py
    outs:
    - reportes/tests_verificados.txt
  generar_reporte:
    cmd: "echo '=== Pipeline DVC Completada ===' > reportes/dvc_pipeline_report.txt
      && echo 'Fecha: $(date)' >> reportes/dvc_pipeline_report.txt && echo '' >> reportes/dvc_pipeline_report.txt
      && echo '✅ Entorno verificado' >> reportes/dvc_pipeline_report.txt && echo '✅
      Scripts de ingesta verificados' >> reportes/dvc_pipeline_report.txt && echo
      '✅ Scripts de transformación verificados' >> reportes/dvc_pipeline_report.txt
      && echo '✅ Módulos de visualización y modelo verificados' >> reportes/dvc_pipeline_report.txt
      && echo '✅ Tests unitarios ejecutados' >> reportes/dvc_pipeline_report.txt &&
      echo '' >> reportes/dvc_pipeline_report.txt && echo '=== Estado de Archivos
      ===' >> reportes/dvc_pipeline_report.txt && ls -la datos/raw/snies/matriculados/
      >> reportes/dvc_pipeline_report.txt && ls -la datos/raw/snies/graduados/ >>
      reportes/dvc_pipeline_report.txt"
    deps:
    - reportes/entorno_verificado.txt
    - reportes/ingesta_main_verificada.txt
    - reportes/ingesta_original_verificada.txt
    - reportes/ingesta_snies_verificada.txt
    - reportes/modelo_verificado.txt
    - reportes/tests_verificados.txt
    - reportes/transformacion_verificada.txt
    - reportes/visualizacion_verificada.txt
    outs:
    - reportes/dvc_pipeline_report.txt
